name: CI - Push to GHCR
on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Get clone code
              uses: actions/checkout@v4

            - name: Bun setup
              uses: oven-sh/setup-bun@v2

            - name: Install dependencies
              run: bun ci

            - name: Check formatting, linting, and imports
              run: bunx biome ci

            - name: Type check
              run: bunx tsc --noEmit
            
